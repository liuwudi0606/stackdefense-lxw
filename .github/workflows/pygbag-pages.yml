# 构建网页版并发布到 GitHub Pages（Settings → Pages → Source: GitHub Actions）
name: pygbag-pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps and pygbag
        run: |
          pip install pygame-ce pillow pygbag soundfile
          python tools/gen_sprites.py
          python -c "from game.audio import ensure_sounds, ensure_ogg_sounds; ensure_sounds(); ensure_ogg_sounds()"

      - name: Build web package
        run: |
          python -m pygbag --build --width 960 --height 640 --app_name stackdefense --template web/default.tmpl .
          python tools/patch_web_index.py
          python tools/ensure_web_headers.py
          python tools/vendor_web_cdn.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
